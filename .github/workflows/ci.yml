name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bundle-report
          path: dist/bundle-report.json
          if-no-files-found: warn

  # Cargo path dep expects ../../../rust/windows_tool from src-tauri.
  # Cargo.lock does not pin path dependencies, so keep the mirror revision explicit.
  rust-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: tauri/mxtools
      - uses: actions/checkout@v6
        with:
          repository: xmx-emm/windows_tool
          ref: 63be28c24cc093a8d160d902cb983331dc9c9e2e
          path: rust/windows_tool
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tauri/mxtools/src-tauri -> target
          key: windows-tool-63be28c24cc093a8d160d902cb983331dc9c9e2e
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: cargo fmt --check
        working-directory: tauri/mxtools/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: tauri/mxtools/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: tauri/mxtools/src-tauri
        run: cargo test
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri/mxtools/package-lock.json
      - name: Install frontend test dependencies
        working-directory: tauri/mxtools
        run: npm ci
      - name: Apex presets through native video files
        working-directory: tauri/mxtools
        run: npm run test:apex-video-native
